[package]
name = "omarchy-bluetooth-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[dependencies]
libc = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "process", "time"] }
